<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="40%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>

    <!-- Logo Monogram Gradient -->
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer Glow Ring -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="4"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#logoGrad)" stroke-width="3" opacity="0.4" filter="url(#glow)"/>

  <!-- Geometric Abstract MH & Factory Symbol -->
  <g transform="translate(0, 0)">
    <!-- Letter M Left Pillar -->
    <path d="M 120 370 L 120 150 Q 120 140 130 140 L 155 140 Q 165 140 170 150 L 220 250 L 220 150 Q 220 140 230 140 L 250 140 Q 260 140 260 150 L 260 370 Q 260 380 245 380 L 225 380 Q 215 380 210 370 L 160 270 L 160 370 Q 160 380 145 380 L 135 380 Q 120 380 120 370 Z" fill="url(#logoGrad)"/>
    
    <!-- Letter H Right Pillar -->
    <path d="M 290 150 Q 290 140 305 140 L 325 140 Q 340 140 340 150 L 340 230 L 390 230 L 390 150 Q 390 140 405 140 L 425 140 Q 440 140 440 150 L 440 370 Q 440 380 425 380 L 405 380 Q 390 380 390 370 L 390 280 L 340 280 L 340 370 Q 340 380 325 380 L 305 380 Q 290 380 290 370 Z" fill="url(#logoGrad)"/>
    
    <!-- Electric Bolt / Needle Accent -->
    <polygon points="275,120 235,240 270,240 235,360 315,220 275,220" fill="url(#accentGrad)" filter="url(#glow)"/>
  </g>

  <!-- Live Status Pulse Dot -->
  <circle cx="410" cy="100" r="18" fill="#34d399" filter="url(#glow)"/>
  <circle cx="410" cy="100" r="10" fill="#ffffff"/>
</svg>
